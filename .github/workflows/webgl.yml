name: WebGL
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: island-pages
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, unity-island]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
          clean: false
          persist-credentials: false
      - name: Build Unity WebGL
        shell: powershell
        run: ./Tools/Build-WebGL.ps1 -SeedVendorAssets
      - name: Locate Git Bash
        shell: powershell
        run: |
          $gitBin = Join-Path (Split-Path (Split-Path (Get-Command git).Source)) bin
          if (!(Test-Path "$gitBin/bash.exe")) { throw 'Git Bash is required to package the Pages artifact.' }
          $gitBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: actions/upload-pages-artifact@v4
        with:
          path: Builds/WebGL

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: pages
